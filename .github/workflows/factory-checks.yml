name: Factory checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  node-tests:
    name: Node 24 factory tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          check-latest: false
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: git diff --check
  tailnet-web:
    name: Tailnet proxy Go tests and macOS build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: tailnet-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: Resolve initial dependency lock or verify the committed lock
        run: |
          if test -f go.sum; then
            go mod tidy -diff
          else
            go mod tidy
          fi
          go mod verify
      - name: Run fixture tests without authenticating or starting tsnet
        run: go test -mod=readonly -race ./...
      - name: Build macOS Apple Silicon binary without running it
        run: |
          mkdir -p ../tailnet-web-artifact
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -mod=readonly -trimpath -o ../tailnet-web-artifact/paperclip-tailnet-web .
          cp go.mod go.sum ../tailnet-web-artifact/
          actual_sha=$(git rev-parse HEAD)
          test "$actual_sha" = "$EXPECTED_SOURCE_SHA"
          printf '%s\n' "$actual_sha" > ../tailnet-web-artifact/source-sha.txt
          go version > ../tailnet-web-artifact/toolchain.txt
          cd ../tailnet-web-artifact
          sha256sum paperclip-tailnet-web go.mod go.sum source-sha.txt toolchain.txt > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailnet-web-darwin-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: tailnet-web-artifact/
          if-no-files-found: error
          retention-days: 7
