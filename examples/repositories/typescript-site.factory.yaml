# Factory convention v1. Replace the example repository and environment ID.
schemaVersion: 1
repository: example/typescript-site
defaultBranch: develop
cloud:
  environmentId: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
commands:
  test:
    argv: [npm, test, --, --run]
  lint:
    argv: [npm, run, lint]
    timeoutMs: 180000
  build:
    argv: [npm, run, build]
    timeoutMs: 600000
delivery:
  requiredChecks:
    - unit-tests
    - lint
    - build
concurrency:
  maxActive: 1
  maxAttempts: 3
secretRefs:
  GITHUB_TOKEN:
    env: FACTORY_GITHUB_TOKEN
